name: Rebuild and verify Lark release
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rebuild-release.yml
permissions:
  contents: read
concurrency:
  group: lark-release-repair
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full python3-pil zip
      - name: Build all release packages
        env:
          LARK_UPDATE_BASE: https://github.com/TreyvoPrime/lark/releases/download/v4.0.4
        run: |
          test "$(sed -n 's/.*VERSION = "\([^"]*\)".*/\1/p' src/lark/Settings.java | head -1)" = 4.0.4
          ./packaging/make-release.sh
      - name: Verify actual packages and updater regression tests
        run: |
          python3 test/release-artifacts.py
          javac -cp dist/lark.jar -d build/test test/Check.java
          java -cp dist/lark.jar:build/test lark.Check
          node test/share-scroll.test.cjs
          node test/share-document.test.cjs
          cd release
          sha256sum *.zip *.exe > SHA256SUMS.txt
          sha256sum lark-desktop-update.zip > lark-desktop-update.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            release/*.zip
            release/*.exe
            release/*.json
            release/*.sha256
            release/SHA256SUMS.txt
          retention-days: 7
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release
      - name: Fresh installation and installed Java server smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process -FilePath (Resolve-Path release/LarkDesktopSetup.exe) -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $install = Join-Path $env:LOCALAPPDATA 'Programs/Lark'
          $java = Join-Path $install 'jdk/bin/java.exe'
          $jar = Join-Path $install 'app/lark.jar'
          & $java -version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Java failed' }
          & (Join-Path $install 'jdk/bin/javac.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'Installed compiler failed' }
          & (Join-Path $install 'jdk/bin/keytool.exe') -help
          if ($LASTEXITCODE -ne 0) { throw 'Installed keytool failed' }
          Expand-Archive release/lark-desktop-update.zip -DestinationPath expected
          if ((Get-FileHash $jar).Hash -ne (Get-FileHash expected/app/lark.jar).Hash) { throw 'Installed application differs from update' }
          $server = Start-Process $java -ArgumentList @('-cp', "`"$jar`"", 'lark.Desktop', '--no-browser', '--port', '43123') -PassThru -RedirectStandardOutput server.log -RedirectStandardError server-error.log
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { $health = Invoke-RestMethod http://127.0.0.1:43123/api/health; break } catch { Start-Sleep 1 }
            }
            if (!$health.ok -or $health.version -ne '4.0.4') { throw 'Installed server did not report 4.0.4' }
            $health | ConvertTo-Json
            & (Join-Path $install 'jdk/bin/javac.exe') -cp $jar -d build/test test/Check.java
            if ($LASTEXITCODE -ne 0) { throw 'Regression test compile failed' }
            & $java -cp "$jar;build/test" lark.Check
            if ($LASTEXITCODE -ne 0) { throw 'Windows updater regression tests failed' }
          } finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs
          path: server*.log
  publish:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: release
      - name: Replace verified binaries, then update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.0.4 --repo TreyvoPrime/lark
          gh release upload v4.0.4 release/*.zip release/*.exe release/*.sha256 release/SHA256SUMS.txt --repo TreyvoPrime/lark --clobber
          gh release upload v4.0.4 release/update.json --repo TreyvoPrime/lark --clobber
