name: Build Lark 4.7 draft assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis python3-pil zip
      - name: Build the 4.7 release set
        env:
          LARK_RELEASE_TAG: v4.7
          LARK_UPDATE_BASE: https://github.com/TreyvoPrime/lark/releases/download/v4.7
        run: |
          test "$(sed -n 's/.*VERSION = "\([^\"]*\)".*/\1/p' src/lark/Settings.java | head -1)" = 4.7
          ./packaging/make-release.sh
      - name: Verify packages
        run: |
          python3 test/release-artifacts.py
          test "$(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.sha256' -o -name 'update.json' \) | wc -l)" = 18
      - uses: actions/upload-artifact@v4
        with:
          name: lark-4-7-release-assets
          path: |
            release/*.zip
            release/*.exe
            release/*.sha256
            release/update.json
          if-no-files-found: error
          retention-days: 1
