name: Lark stability checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash package.sh
      - run: |
          javac --release 17 -cp build -d build test/MobileSandboxCheck.java test/MobileShareCheck.java test/ShareCheck.java test/ShareEditingCheck.java test/GitHubAuthCheck.java test/FlowCheck.java test/LanInterfacesCheck.java test/Check.java
          java -cp build lark.MobileSandboxCheck
          java -cp build lark.MobileShareCheck
          java -cp build lark.ShareCheck
          java -cp build lark.ShareEditingCheck
          java -cp build lark.GitHubAuthCheck
          java -cp build lark.FlowCheck
          java -cp build lark.LanInterfacesCheck
          java -cp dist/lark.jar:build lark.Check
          node test/share-document.test.cjs
          node test/share-scroll.test.cjs
          node test/share-lifecycle.test.cjs
          node test/java-parse.test.js
          node test/typing.test.cjs
          python3 test/mobile-host-smoke.py
          LARK_SMOKE_TLS=1 python3 test/mobile-host-smoke.py
      - run: npm install --no-save playwright jsdom
      - run: |
          node test/share-keyboard-dom.cjs
          node test/mobile-dom.cjs
          node test/mobile-share-dom.cjs
          node test/typing-dom.cjs
      - run: npx playwright install --with-deps chromium
      - name: Real browser collaboration regression
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node test/share-browser.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tested-development-jar
          path: dist/lark.jar
